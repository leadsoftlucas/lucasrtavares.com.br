# M0: CI minimo (so build). Lighthouse CI e deploy entram na fase M6.
# Este workflow NAO publica nada.
name: Build
on:
  pull_request:
  push:
    branches: [redesign/astro]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
      PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      PUBLIC_WHATSAPP_RAVENDB: ${{ vars.PUBLIC_WHATSAPP_RAVENDB }}
      PUBLIC_WHATSAPP_LEADSOFT: ${{ vars.PUBLIC_WHATSAPP_LEADSOFT }}
      PUBLIC_EMAIL_RAVENDB: ${{ vars.PUBLIC_EMAIL_RAVENDB }}
      PUBLIC_EMAIL_PERSONAL: ${{ vars.PUBLIC_EMAIL_PERSONAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
